<!doctype html><html lang="UI_LANG"><meta charset="utf-8"><style>
body{font:16px system-ui;color:#352452;background:#f6f0ff;border-radius:14px;padding:12px;margin:0}
audio{width:100%;margin:8px 0}section{max-height:155px;overflow:auto}article{padding:7px;border-inline-start:4px solid transparent;white-space:pre-wrap}article.active{background:#d4f5ed;border-color:#187563}button,select{padding:5px;border-radius:6px;margin:3px}
</style><b id="heading"></b><audio controls id="sound"></audio><div><button id="repeat"></button><label id="speedLabel" for="speed"></label><select id="speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select></div><section id="list"></section>
<script>
const tracks=TRACK_DATA, fa=document.documentElement.lang==='fa';
document.body.dir=fa?'rtl':'ltr';
const sound=document.querySelector('audio'),list=document.querySelector('section'),speed=document.querySelector('#speed');
let current=0;
tracks.forEach(([n,lang,text])=>{const row=document.createElement('article');row.lang=lang;row.dir=lang==='fa'?'rtl':'ltr';row.textContent=text;list.append(row)});
function select(i,play){current=i;const [n,lang,text,data]=tracks[i];heading.textContent=(fa?'بند ':'Passage ')+(n+1)+' · '+lang.toUpperCase();
Array.from(list.children).forEach((e,j)=>e.classList.toggle('active',i===j));
list.scrollTop=list.children[i].offsetTop-list.children[0].offsetTop;
sound.src='data:audio/mpeg;base64,'+data;sound.playbackRate=Number(speed.value);if(play)sound.play().catch(()=>{});}
repeat.textContent=fa?'تکرار بند':'Replay passage';repeat.onclick=()=>select(tracks.findIndex(x=>x[0]===tracks[current][0]),true);
speedLabel.textContent=fa?'سرعت':'Speed';speed.onchange=()=>sound.playbackRate=Number(speed.value);
sound.onended=()=>{if(current+1<tracks.length) select(current+1,true);else select(0,false)};select(0,false);
</script></html>
